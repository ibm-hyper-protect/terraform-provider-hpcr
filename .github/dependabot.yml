# Dependabot keeps GitHub Actions SHA pins up to date automatically.
# It opens a PR weekly with the new commit SHA + tag comment whenever
# an action releases a new version. Review and merge to update.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
